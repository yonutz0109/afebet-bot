<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="/manifest.json"><title>SafeBet Bot</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:22px}h1{font-size:34px;margin:38px 0 28px}.card{background:#1e293b;padding:22px;border-radius:22px;margin-bottom:20px}.label{color:#94a3b8;font-size:14px;margin-bottom:6px}.value{font-size:20px;margin-bottom:14px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:18px;margin-top:8px}button{background:#22c55e;border:none;padding:14px 18px;border-radius:13px;color:white;font-size:17px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#334155}button.danger{background:#ef4444}.small{color:#94a3b8;font-size:13px;line-height:1.45}.tip-title{font-size:23px;font-weight:800;margin-bottom:15px}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#0f172a;color:#cbd5e1;margin:4px 4px 8px 0;font-size:13px}.error{color:#fecaca}.success{color:#bbf7d0}.warning{color:#fde68a}.report-box{border:1px solid #334155;border-radius:16px;padding:14px;margin-top:12px;background:#0f172a}.top-item{border-top:1px solid #334155;padding:12px 0}.good{color:#bbf7d0}.medium{color:#fde68a}.bad{color:#fecaca}
</style></head><body><h1>⚽ SafeBet Bot</h1>
<div class="card"><div class="tip-title">Buget curent</div><div class="value"><span id="bankroll">2.00</span> lei</div><div class="small">Se salvează pe telefon/browser.</div><input id="bankrollInput" type="number" min="0" step="0.01"><button onclick="saveBankroll()">Salvează buget</button></div>
<div class="card"><div class="tip-title">Cea mai safe selecție v5.0</div><div id="status" class="small">Apasă „Scanează”.</div><div id="recommendation" style="margin-top:14px"></div><button onclick="scanRealMatches()">Scanează</button><button class="secondary" onclick="skipTip()">Sari peste</button><button onclick="markWin()">Câștigat</button><button class="danger" onclick="markLoss()">Pierdut</button></div>
<div class="card"><div class="tip-title">Istoric</div><div id="history" class="small">Nu ai istoric încă.</div></div>
<script>
let bankroll=Number(localStorage.getItem("bankroll")||"2");let currentTip=null;let history=JSON.parse(localStorage.getItem("history")||"[]");
function fmt(n){return Number(n).toFixed(2)}function renderBankroll(){document.getElementById("bankroll").innerText=fmt(bankroll);document.getElementById("bankrollInput").value=bankroll}
function saveBankroll(){let v=Number(document.getElementById("bankrollInput").value);if(!isNaN(v)&&v>=0){bankroll=v;localStorage.setItem("bankroll",bankroll);renderBankroll()}}
function renderHistory(){let el=document.getElementById("history");if(history.length===0){el.innerText="Nu ai istoric încă.";return}el.innerHTML=history.slice().reverse().map(h=>`<div class="top-item"><b>${h.result}</b> · ${h.match}<br>${h.pick} · ${h.marketLabel} · Cotă ${h.odd} · Buget: ${h.bankroll} lei</div>`).join("")}
function selectionCard(t,title){let cls=t.verdict==="JOACĂ"?"good":"medium";return `<div class="report-box"><div class="label">${title}</div><div class="value">${t.match||"Meci necunoscut"}</div><div class="label">Selecție</div><div class="value">${t.pick||"Selecție necunoscută"}</div><span class="pill">Piață: ${t.marketLabel||"necunoscută"}</span><span class="pill">Cotă: ${t.odd||"n/a"}</span><span class="pill">Safe Score: ${t.safeScore??"n/a"}/100</span><span class="pill">Prag: 75/100</span><span class="pill">Bookmaker: ${t.bookmaker||"n/a"}</span><span class="pill">Start: ${t.startTime||"necunoscut"}</span><div style="margin-top:12px"><div class="label">Verdict</div><div class="value ${cls}">${t.verdict||"CEL MAI BUN GĂSIT"}</div><div class="small">${t.reason||t.rejectReason||""}</div></div></div>`}
function marketsBox(r){let m=r.marketStats||{};return `<div class="report-box"><div class="label">Piețe găsite în răspuns</div><span class="pill">1X2: ${m.h2h||0}</span><span class="pill">Goluri: ${m.totals||0}</span><span class="pill">Handicap: ${m.spreads||0}</span><span class="pill">Altele: ${m.other||0}</span></div>`}
function topBox(list){if(!list||!list.length)return"";return `<div class="report-box"><div class="label">Top 5 selecții găsite</div>${list.map(x=>`<div class="top-item"><b>${x.match}</b><br>${x.pick}<br><span class="pill">Piață: ${x.marketLabel}</span><span class="pill">Cotă: ${x.odd}</span><span class="pill">Safe Score: ${x.safeScore}/100</span><span class="pill">${x.bookmaker}</span></div>`).join("")}</div>`}
function renderResult(data){let r=data.report||{};let t=data.tip||r.bestOverall||r.firstAvailable;currentTip=data.accepted?t:null;document.getElementById("recommendation").innerHTML=`<div class="report-box"><div class="label">Raport scanare</div><span class="pill">Meciuri: ${r.eventsChecked||0}</span><span class="pill">Opțiuni: ${r.outcomesChecked||0}</span><span class="pill">Scanare: ${r.scannedAt||"-"}</span><div class="small" style="margin-top:10px">${data.message||""}</div></div>${marketsBox(r)}${t?selectionCard(t,data.accepted?"Recomandare acceptată":"Cea mai bună selecție găsită"):""}${topBox(r.topOverall)}`}
async function scanRealMatches(){let st=document.getElementById("status");st.innerHTML="Scanez toate datele disponibile...";document.getElementById("recommendation").innerHTML="";try{let res=await fetch("/api/scan?ts="+Date.now());let data=await res.json();if(!res.ok){st.innerHTML=`<span class="error">${data.error||"Eroare API"}</span>`;document.getElementById("recommendation").innerHTML=`<div class="small">${data.help||""}</div>`;return}st.innerHTML=data.accepted?`<span class="success">Am găsit selecție peste prag.</span>`:`<span class="warning">Nu recomand pariu, dar afișez cea mai bună selecție găsită.</span>`;renderResult(data)}catch(e){st.innerHTML=`<span class="error">Nu pot conecta aplicația la API acum.</span>`}}
function addHistory(r){if(!currentTip)return;history.push({result:r,match:currentTip.match,pick:currentTip.pick,marketLabel:currentTip.marketLabel,odd:currentTip.odd,bankroll:fmt(bankroll),time:new Date().toISOString()});localStorage.setItem("history",JSON.stringify(history));renderHistory()}
function markWin(){if(!currentTip)return;bankroll=bankroll*Number(currentTip.odd);localStorage.setItem("bankroll",bankroll);addHistory("Câștigat");renderBankroll()}
function markLoss(){if(!currentTip)return;bankroll=0;localStorage.setItem("bankroll",bankroll);addHistory("Pierdut");renderBankroll()}
function skipTip(){currentTip=null;document.getElementById("recommendation").innerHTML="";document.getElementById("status").innerText="Recomandarea a fost sărită."}
renderBankroll();renderHistory();if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}
</script></body></html>
