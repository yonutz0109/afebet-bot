<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="manifest" href="/manifest.json" />
  <title>SafeBet Bot</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#07111f;color:white}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18345f,#07111f 45%,#05070c);padding:18px}.app{max-width:520px;margin:auto}.hero{padding:22px 0}.title{font-size:32px;font-weight:850;margin:0}.sub{color:#a8b3c7;margin-top:8px;line-height:1.4}.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 16px 45px rgba(0,0,0,.25);backdrop-filter:blur(12px)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.big{font-size:34px;font-weight:850}.muted{color:#a8b3c7}.btn{width:100%;border:0;border-radius:18px;padding:16px 18px;background:#22c55e;color:#04110a;font-weight:800;font-size:16px;margin-top:10px}.btn.secondary{background:rgba(255,255,255,.12);color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:rgba(34,197,94,.16);color:#86efac;font-weight:700;font-size:13px}.risk{height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}.risk span{display:block;height:100%;background:#22c55e;width:0%}.pick{font-size:20px;font-weight:850}.small{font-size:13px}.history{max-height:220px;overflow:auto}.item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}input,select{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.24);color:white;padding:13px;border-radius:14px;font-size:16px}.warn{color:#fbbf24}.err{color:#fca5a5;white-space:pre-wrap}.ok{color:#86efac}</style>
</head>
<body>
  <div class="app">
    <div class="hero"><h1 class="title">SafeBet Bot</h1><div class="sub">Versiune de probă reală: caută cote prin API și propune selecții cu risc scăzut. Nu pariază automat.</div></div>
    <div class="card"><div class="row"><div><div class="muted">Buget curent</div><div class="big"><span id="bankroll">2.00</span> lei</div></div><span class="pill">SAFE MODE</span></div><div class="grid"><button class="btn secondary" onclick="resetBankroll()">Reset 2 lei</button><button class="btn secondary" onclick="addProfit()">+ câștig</button></div></div>
    <div class="card"><div class="row"><div><div class="muted">Sport</div><select id="sport"><option value="soccer_epl">Premier League</option><option value="soccer_spain_la_liga">La Liga</option><option value="soccer_italy_serie_a">Serie A</option><option value="soccer_germany_bundesliga">Bundesliga</option><option value="soccer_france_ligue_one">Ligue 1</option><option value="soccer_uefa_champs_league">Champions League</option></select></div></div><button class="btn" onclick="scan()">Scanează pariuri safe</button><div id="status" class="muted small" style="margin-top:10px">Pregătit.</div></div>
    <div id="result" class="card" style="display:none"></div>
    <div class="card"><div class="row"><b>Istoric</b><button class="btn secondary" style="width:auto;margin:0;padding:10px 12px" onclick="clearHistory()">Șterge</button></div><div id="history" class="history muted small">Nimic încă.</div></div>
    <div class="muted small" style="padding:8px 4px 30px">Atenție: nu există pariuri sigure. Folosește responsabil și doar cu sume pe care îți permiți să le pierzi.</div>
  </div>
<script>
let bankroll = Number(localStorage.getItem('bankroll') || '2');
let history = JSON.parse(localStorage.getItem('history') || '[]');
function save(){localStorage.setItem('bankroll',bankroll.toFixed(2));localStorage.setItem('history',JSON.stringify(history));render()}function render(){document.getElementById('bankroll').textContent=bankroll.toFixed(2);document.getElementById('history').innerHTML=history.length?history.map(h=>`<div class="item"><b>${h.title}</b><br>${h.text}<br><span class="muted">${h.date}</span></div>`).join(''):'Nimic încă.'}render();
function resetBankroll(){bankroll=2; history.unshift({title:'Reset buget',text:'Buget resetat la 2 lei.',date:new Date().toLocaleString('ro-RO')}); save()}
function addProfit(){let v=prompt('Cât este bugetul nou după câștig? ex: 2.50', bankroll.toFixed(2)); if(!v)return; bankroll=Number(String(v).replace(',','.'))||bankroll; history.unshift({title:'Actualizare buget',text:`Buget setat la ${bankroll.toFixed(2)} lei.`,date:new Date().toLocaleString('ro-RO')}); save()}
function clearHistory(){history=[];save()}
function implied(odds){return 100/odds}
function scorePick(odds, market){let s=92-Math.abs(1.32-odds)*38; if(market.includes('Double Chance'))s+=4; if(market.includes('Over 0.5'))s+=6; if(odds>1.65)s-=20; if(odds<1.12)s-=8; return Math.max(1,Math.min(96,Math.round(s)))}
async function scan(){const status=document.getElementById('status'); const result=document.getElementById('result'); status.textContent='Scanez cote reale...'; result.style.display='none'; try{const sport=document.getElementById('sport').value; const r=await fetch(`/api/odds?sport=${encodeURIComponent(sport)}`); const data=await r.json(); if(!r.ok) throw new Error(data.error||'Eroare API'); let picks=[]; for(const game of data.events||[]){for(const bm of game.bookmakers||[]){for(const m of bm.markets||[]){for(const o of m.outcomes||[]){const price=Number(o.price); if(price>=1.12 && price<=1.65){let market=m.key==='h2h'?'1X2 / Moneyline':m.key; let sc=scorePick(price, market); if(sc>=72)picks.push({game:`${game.home_team} vs ${game.away_team}`,bookmaker:bm.title,market,outcome:o.name,odds:price,score:sc,commence_time:game.commence_time})}}}}} picks.sort((a,b)=>b.score-a.score||a.odds-b.odds); const p=picks[0]; if(!p){status.innerHTML='<span class="warn">Nu am găsit ceva suficient de safe acum.</span>'; return} status.innerHTML='<span class="ok">Am găsit o selecție.</span>'; result.style.display='block'; result.innerHTML=`<div class="row"><span class="pill">Score ${p.score}/100</span><span class="muted small">${p.bookmaker}</span></div><div style="height:12px"></div><div class="pick">${p.outcome}</div><div class="muted">${p.game}</div><div class="small muted">Piață: ${p.market} · Cotă: <b>${p.odds.toFixed(2)}</b></div><div style="height:14px"></div><div class="risk"><span style="width:${p.score}%"></span></div><div style="height:10px"></div><div class="small">Miză sugerată: <b>${bankroll.toFixed(2)} lei</b> în modul tău all-in de probă. Risc estimat: scăzut, dar nu sigur.</div><button class="btn" onclick='markWin(${JSON.stringify(p).replaceAll("'","&apos;")})'>Marchează câștigat</button><button class="btn secondary" onclick='markLoss(${JSON.stringify(p).replaceAll("'","&apos;")})'>Marchează pierdut</button>`}catch(e){status.innerHTML='<span class="err">'+e.message+'</span>'}}
function markWin(p){bankroll=bankroll*p.odds;history.unshift({title:'Câștigat',text:`${p.outcome} @ ${p.odds} — buget nou ${bankroll.toFixed(2)} lei`,date:new Date().toLocaleString('ro-RO')});save()}
function markLoss(p){bankroll=0;history.unshift({title:'Pierdut',text:`${p.outcome} @ ${p.odds} — buget 0 lei`,date:new Date().toLocaleString('ro-RO')});save()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
</script>
</body>
</html>
