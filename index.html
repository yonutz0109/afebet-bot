<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<title>SafeBet Bot</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:22px}
h1{font-size:34px;margin:38px 0 28px}
.card{background:#1e293b;padding:22px;border-radius:22px;margin-bottom:20px}
.label{color:#94a3b8;font-size:14px;margin-bottom:6px}
.value{font-size:20px;margin-bottom:14px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:18px;margin-top:8px}
button{background:#22c55e;border:none;padding:14px 18px;border-radius:13px;color:white;font-size:17px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}
button.secondary{background:#334155}
button.danger{background:#ef4444}
.small{color:#94a3b8;font-size:13px;line-height:1.45}
.tip-title{font-size:23px;font-weight:800;margin-bottom:15px}
.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#0f172a;color:#cbd5e1;margin:4px 4px 8px 0;font-size:13px}
.error{color:#fecaca}.success{color:#bbf7d0}.warning{color:#fde68a}
.history-item{border-top:1px solid #334155;padding:10px 0;font-size:14px;color:#cbd5e1}
.report-box{border:1px solid #334155;border-radius:16px;padding:14px;margin-top:12px;background:#0f172a}
.top-item{border-top:1px solid #334155;padding:12px 0}
.good{color:#bbf7d0}.medium{color:#fde68a}.bad{color:#fecaca}
</style>
</head>
<body>
<h1>⚽ SafeBet Bot</h1>

<div class="card">
  <div class="tip-title">Buget curent</div>
  <div class="value"><span id="bankroll">2.00</span> lei</div>
  <div class="small">Se salvează pe telefon/browser.</div>
  <input id="bankrollInput" type="number" min="0" step="0.01">
  <button onclick="saveBankroll()">Salvează buget</button>
</div>

<div class="card">
  <div class="tip-title">Cea mai safe selecție v4.2</div>
  <div id="status" class="small">Apasă „Scanează”.</div>
  <div id="recommendation" style="margin-top:14px"></div>
  <button onclick="scanRealMatches()">Scanează</button>
  <button class="secondary" onclick="skipTip()">Sari peste</button>
  <button onclick="markWin()">Câștigat</button>
  <button class="danger" onclick="markLoss()">Pierdut</button>
</div>

<div class="card">
  <div class="tip-title">Istoric</div>
  <div id="history" class="small">Nu ai istoric încă.</div>
</div>

<script>
let bankroll=Number(localStorage.getItem("bankroll")||"2");
let currentTip=null;
let history=JSON.parse(localStorage.getItem("history")||"[]");

function fmt(n){return Number(n).toFixed(2)}
function renderBankroll(){
  bankroll=Number(bankroll)||0;
  document.getElementById("bankroll").innerText=fmt(bankroll);
  document.getElementById("bankrollInput").value=bankroll;
}
function saveBankroll(){
  let v=Number(document.getElementById("bankrollInput").value);
  if(!isNaN(v)&&v>=0){
    bankroll=v;
    localStorage.setItem("bankroll",bankroll);
    renderBankroll();
  }
}
function renderHistory(){
  let el=document.getElementById("history");
  if(history.length===0){el.innerText="Nu ai istoric încă.";return}
  el.innerHTML=history.slice().reverse().map(h=>`
    <div class="history-item">
      <b>${h.result}</b> · ${h.match}<br>
      ${h.pick} · ${h.marketLabel} · Cotă ${h.odd} · Buget: ${h.bankroll} lei
    </div>`).join("");
}
function statBox(s){
  if(!s)return"";
  return `<div class="report-box">
    <div class="label">API-FOOTBALL</div>
    <span class="pill">Liga: ${s.league||"n/a"}</span>
    <span class="pill">Țara: ${s.country||"n/a"}</span>
    <span class="pill">H2H: ${s.h2hCount??"n/a"}</span>
    <span class="pill">Bonus: +${s.boost||0}</span>
    <div class="small" style="margin-top:10px">${s.note||""}</div>
  </div>`;
}
function verdictClass(v){
  if(v==="JOACĂ")return"good";
  if(v==="ATENȚIE")return"medium";
  return"bad";
}
function selectionCard(t, title, isRecommended){
  const cls=verdictClass(t.verdict);
  return `<div class="report-box">
    <div class="label">${title}</div>
    <div class="value">${t.match}</div>
    <div class="label">Selecție</div>
    <div class="value">${t.pick}</div>
    <span class="pill">Piață: ${t.marketLabel}</span>
    <span class="pill">Cotă: ${t.odd}</span>
    <span class="pill">Safe Score: ${t.safeScore}/100</span>
    <span class="pill">Bookmaker: ${t.bookmaker}</span>
    <span class="pill">Start: ${t.startTime||"necunoscut"}</span>
    <div style="margin-top:12px">
      <div class="label">Verdict</div>
      <div class="value ${cls}">${t.verdict}</div>
      <div class="small">${isRecommended ? t.reason : (t.rejectReason || t.reason)}</div>
    </div>
    ${statBox(t.footballStats)}
  </div>`;
}
function renderSelection(t, isRecommended){
  currentTip=isRecommended?t:null;
  document.getElementById("recommendation").innerHTML=selectionCard(
    t,
    isRecommended ? "Recomandare acceptată" : "Cea mai bună selecție găsită, dar respinsă",
    isRecommended
  );
}
function marketsBox(r){
  let m=r.marketStats||{};
  return `<div class="report-box">
    <div class="label">Piețe scanate</div>
    <span class="pill">1X2: ${m.h2h||0}</span>
    <span class="pill">Goluri: ${m.totals||0}</span>
    <span class="pill">Handicap: ${m.spreads||0}</span>
    <span class="pill">Cornere: ${m.corners||0}</span>
    <span class="pill">Cartonașe: ${m.cards||0}</span>
  </div>`;
}
function topBox(list){
  if(!list||!list.length)return"";
  return `<div class="report-box">
    <div class="label">Top 5 selecții găsite</div>
    ${list.map(x=>`
      <div class="top-item">
        <b>${x.match}</b><br>
        ${x.pick}<br>
        <span class="pill">Piață: ${x.marketLabel}</span>
        <span class="pill">Cotă: ${x.odd}</span>
        <span class="pill">Safe Score: ${x.safeScore}/100</span>
        <span class="pill">${x.bookmaker}</span>
      </div>`).join("")}
  </div>`;
}
function renderReport(r){
  currentTip=null;
  const best=r.bestOverall;
  const bestHtml=best ? selectionCard(best, "Cea mai bună selecție găsită, dar respinsă", false) : "";
  document.getElementById("recommendation").innerHTML=`
    <div class="report-box">
      <div class="label">Raport scanare</div>
      <span class="pill">Meciuri: ${r.eventsChecked||0}</span>
      <span class="pill">Opțiuni: ${r.outcomesChecked||0}</span>
      <span class="pill">Scanare: ${r.scannedAt||"-"}</span>
      <div class="small" style="margin-top:10px">Nu recomand pariu acum. Mai bine pauză decât un pariu forțat.</div>
    </div>
    ${marketsBox(r)}
    ${bestHtml}
    ${topBox(r.topOverall)}
  `;
}
async function scanRealMatches(){
  let st=document.getElementById("status");
  st.innerHTML="Scanez toate piețele disponibile...";
  document.getElementById("recommendation").innerHTML="";
  try{
    let res=await fetch("/api/scan?ts="+Date.now());
    let data=await res.json();
    if(!res.ok){
      st.innerHTML=`<span class="error">${data.error||"Eroare API"}</span>`;
      document.getElementById("recommendation").innerHTML=`<div class="small">${data.help||""}</div>`;
      return;
    }
    if(data.tip){
      if(data.fallback){
        st.innerHTML=`<span class="warning">Am afișat cea mai safe selecție găsită, dar este sub prag.</span>`;
        renderSelection(data.tip,false);
      }else{
        st.innerHTML=`<span class="success">Am găsit cea mai safe selecție peste prag.</span>`;
        renderSelection(data.tip,true);
      }
    }else{
      st.innerHTML=`<span class="warning">Nu am găsit momentan o selecție suficient de safe.</span>`;
      renderReport(data.report||{});
    }
  }catch(e){
    st.innerHTML=`<span class="error">Nu pot conecta aplicația la API acum.</span>`;
  }
}
function addHistory(r){
  if(!currentTip)return;
  history.push({result:r,match:currentTip.match,pick:currentTip.pick,marketLabel:currentTip.marketLabel,odd:currentTip.odd,bankroll:fmt(bankroll),time:new Date().toISOString()});
  localStorage.setItem("history",JSON.stringify(history));
  renderHistory();
}
function markWin(){
  if(!currentTip)return;
  bankroll=bankroll*Number(currentTip.odd);
  localStorage.setItem("bankroll",bankroll);
  addHistory("Câștigat");
  renderBankroll();
}
function markLoss(){
  if(!currentTip)return;
  bankroll=0;
  localStorage.setItem("bankroll",bankroll);
  addHistory("Pierdut");
  renderBankroll();
}
function skipTip(){
  currentTip=null;
  document.getElementById("recommendation").innerHTML="";
  document.getElementById("status").innerText="Recomandarea a fost sărită.";
}
renderBankroll();
renderHistory();
if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}
</script>
</body>
</html>
