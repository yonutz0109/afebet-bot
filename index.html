<!doctype html><html lang="ro"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#101827"/><link rel="manifest" href="/manifest.webmanifest"/><title>SafeBet Bot</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#111827,#070b15);min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 30px rgba(0,0,0,.25)}h1{font-size:28px;margin:6px 0}h2{font-size:18px;margin:0 0 10px}.muted{color:#aab3cc}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px}button,input,select{border:0;border-radius:14px;padding:13px 14px;font-weight:700}button{background:#49d17d;color:#07120c;cursor:pointer}button.secondary{background:rgba(255,255,255,.12);color:#eef2ff}input,select{background:#fff;color:#111827;min-width:120px}.big{font-size:34px;font-weight:900}.pick{border-left:5px solid #49d17d}.risk{font-size:26px;font-weight:900}.hist{font-size:14px;border-top:1px solid rgba(255,255,255,.12);padding:9px 0}.danger{color:#ffb4b4}.ok{color:#a7f3d0}</style></head><body><div class="wrap"><h1>SafeBet Bot</h1><div class="muted">Versiune de probă reală: citește cote prin The Odds API și recomandă pariuri cu risc mai mic.</div>
<div class="card"><h2>Bankroll</h2><div class="big"><span id="bankroll">2.00</span> lei</div><div class="row" style="margin-top:12px"><input id="amount" type="number" step="0.01" value="2"><button onclick="setBankroll()">Setează</button><button class="secondary" onclick="resetAll()">Reset</button></div></div>
<div class="card"><h2>Scanare</h2><div class="row"><select id="sport"><option value="soccer_epl">Premier League</option><option value="soccer_spain_la_liga">La Liga</option><option value="soccer_italy_serie_a">Serie A</option><option value="soccer_germany_bundesliga">Bundesliga</option><option value="soccer_france_ligue_one">Ligue 1</option><option value="soccer_uefa_champs_league">Champions League</option></select><button onclick="scan()">Scanează cote reale</button></div><p id="status" class="muted">Apasă scanare după ce ai pus ODDS_API_KEY în Vercel.</p></div>
<div id="results"></div><div class="card"><h2>Istoric</h2><div id="history" class="muted">Nimic încă.</div></div></div><script>
let bankroll=Number(localStorage.bankroll||2), history=JSON.parse(localStorage.history||'[]'), lastStake=0;const $=id=>document.getElementById(id);function save(){localStorage.bankroll=bankroll;localStorage.history=JSON.stringify(history);render()}function render(){$('bankroll').textContent=bankroll.toFixed(2);$('history').innerHTML=history.length?history.map(h=>`<div class="hist">${h}</div>`).join(''):'Nimic încă.'}function setBankroll(){bankroll=Number($('amount').value||2);history.unshift('Bankroll setat la '+bankroll.toFixed(2)+' lei');save()}function resetAll(){bankroll=2;history=[];save()}function implied(odd){return 100/odd}function score(odd,market,books){let s=70;if(odd>=1.12&&odd<=1.35)s+=13;else if(odd<=1.6)s+=6;else s-=10;if(market==='h2h')s+=5;if(books>=4)s+=8;return Math.max(1,Math.min(96,Math.round(s)))}function bestFromGame(g){let picks=[];(g.bookmakers||[]).forEach(b=>(b.markets||[]).forEach(m=>(m.outcomes||[]).forEach(o=>{if(!o.price||o.price<1.12||o.price>1.65)return;picks.push({game:g.home_team+' vs '+g.away_team,book:b.title,market:m.key,name:o.name,odd:o.price})})));return picks.map(p=>({...p,score:score(p.odd,p.market,g.bookmakers?.length||0)})).sort((a,b)=>b.score-a.score)[0]}async function scan(){results.innerHTML='';status.textContent='Caut cote reale...';try{const r=await fetch('/api/odds?sport='+$('sport').value);const data=await r.json();if(!r.ok||data.error)throw new Error(data.error||'Eroare API');const picks=data.map(bestFromGame).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);status.textContent=picks.length?'Am găsit selecții. Nu există pariuri sigure; verifică manual în Superbet.':'Nu am găsit nimic potrivit acum.';results.innerHTML=picks.map((p,i)=>`<div class="card pick"><h2>${p.game}</h2><div class="row"><span class="pill">${p.book}</span><span class="pill">${p.market}</span><span class="pill">cotă ${p.odd}</span></div><p><b>Selecție:</b> ${p.name}</p><div class="risk">Safe Score: ${p.score}/100</div><p class="muted">Probabilitate implicită: ${implied(p.odd).toFixed(1)}%. Miză propusă: ${bankroll.toFixed(2)} lei.</p><button onclick="win(${p.odd})">Marchează câștigat</button> <button class="secondary" onclick="lose()">Marchează pierdut</button></div>`).join('')}catch(e){status.innerHTML='<span class="danger">'+e.message+'</span>'}}function win(odd){const old=bankroll;bankroll=bankroll*odd;history.unshift(`Câștig: ${old.toFixed(2)} lei × ${odd} = ${bankroll.toFixed(2)} lei`);save()}function lose(){history.unshift(`Pierdere: ${bankroll.toFixed(2)} lei → 0.00 lei`);bankroll=0;save()}render();
</script></body></html>
