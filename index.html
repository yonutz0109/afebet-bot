<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<title>SafeBet Bot v7</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:16px}
h1{font-size:28px;margin:24px 0 20px;display:flex;align-items:center;gap:10px}
.version{font-size:13px;color:#64748b;background:#1e293b;padding:3px 10px;border-radius:999px}
.card{background:#1e293b;padding:18px;border-radius:18px;margin-bottom:16px}
.label{color:#94a3b8;font-size:12px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.value{font-size:18px;margin-bottom:12px;font-weight:600}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{border:none;padding:12px 16px;border-radius:12px;color:white;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.85}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:#22c55e}
.btn-gray{background:#334155}
.btn-blue{background:#3b82f6}
.btn-win{background:#16a34a}
.btn-loss{background:#ef4444}
.small{color:#94a3b8;font-size:13px;line-height:1.5}
.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#0f172a;color:#cbd5e1;margin:3px;font-size:12px;border:1px solid #334155}
.pill-green{background:#14532d;color:#bbf7d0;border-color:#16a34a}
.pill-yellow{background:#78350f;color:#fde68a;border-color:#d97706}
.pill-red{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.pill-blue{background:#1e3a5f;color:#93c5fd;border-color:#3b82f6}
.live{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.soon{background:#78350f;color:#fde68a;border-color:#d97706}
.prematch{background:#1e293b;color:#94a3b8;border-color:#334155}
.tip-title{font-size:20px;font-weight:800;margin-bottom:14px}
.report-box{border:1px solid #334155;border-radius:14px;padding:14px;margin-top:12px;background:#0f172a}
.top-item{border-top:1px solid #1e293b;padding:10px 0}
.verdict-good{color:#22c55e;font-size:18px;font-weight:800}
.verdict-med{color:#fbbf24;font-size:16px;font-weight:700}
.error-msg{color:#fca5a5;font-size:14px}
.success-msg{color:#86efac;font-size:14px}
.warning-msg{color:#fde68a;font-size:14px}
.source-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;background:#1e3a5f;color:#93c5fd;margin:2px;border:1px solid #3b82f6}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.2s ease-in-out infinite;margin-right:5px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.countdown{font-size:12px;color:#64748b;margin-top:8px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat-box{background:#1e293b;border-radius:10px;padding:8px 10px}
.stat-label{font-size:10px;color:#64748b;text-transform:uppercase}
.stat-value{font-size:15px;font-weight:700;color:#e2e8f0}
#live-indicator{display:none;align-items:center;gap:6px;color:#22c55e;font-size:13px;font-weight:600;margin-bottom:10px}
#live-indicator.active{display:flex}
</style>
</head>
<body>
<h1>⚽ SafeBet Bot <span class="version">v7.0</span></h1>

<div id="live-indicator">
  <span class="live-dot"></span>
  <span>Urmărire live activă — auto-refresh</span>
  <span id="next-refresh" style="color:#64748b;margin-left:8px"></span>
</div>

<div class="card">
  <div class="tip-title">Cea mai safe selecție</div>
  <div id="status" class="small">Apasă „Scanează" sau activează Live pentru refresh automat.</div>
  <div id="recommendation" style="margin-top:12px"></div>
  <div class="btn-row">
    <button class="btn-green" onclick="scanRealMatches()">🔍 Scanează</button>
    <button class="btn-blue" id="btn-live" onclick="toggleLive()">📡 Live Auto</button>
    <button class="btn-gray" onclick="skipTip()">⏭ Sari</button>
    <button class="btn-win" onclick="markWin()">✅ Câștigat</button>
    <button class="btn-loss" onclick="markLoss()">❌ Pierdut</button>
  </div>
  <div id="countdown" class="countdown"></div>
</div>

<div class="card">
  <div class="tip-title">📋 Istoric</div>
  <div id="stats-bar" style="margin-bottom:10px"></div>
  <div id="history" class="small">Nu ai istoric încă.</div>
  <div class="btn-row" style="margin-top:10px">
    <button class="btn-gray" onclick="clearHistory()">🗑 Șterge istoric</button>
    <button class="btn-gray" onclick="exportHistory()">📥 Export JSON</button>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let currentTip = null;
let liveInterval = null;
let liveActive = false;
let refreshCountdown = 0;

const DB_NAME = "safebet-db", DB_STORE = "history", DB_VERSION = 1;
let db = null;

// ─── IndexedDB ────────────────────────────────────────────────────────────────
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE, { keyPath: "id", autoIncrement: true });
    req.onsuccess = e => res(e.target.result);
    req.onerror = () => rej(req.error);
  });
}
async function dbGetAll() {
  if (!db) db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function dbAdd(item) {
  if (!db) db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).add(item);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function dbClear() {
  if (!db) db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).clear();
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

// ─── Render helpers ───────────────────────────────────────────────────────────
function statusClass(s) { return s === "LIVE ACUM" ? "live" : s === "ÎNCEPE CURÂND" ? "soon" : "prematch"; }

function pillsFromStats(label, s) {
  if (!s) return "";
  const items = [];
  if (label === "football") {
    items.push(`<span class="pill">Formă: ${s.homeForm||"n/a"} vs ${s.awayForm||"n/a"}</span>`);
    items.push(`<span class="pill">H2H: ${s.h2hCount??0}</span>`);
    items.push(`<span class="pill pill-blue">Bonus: +${s.boost||0}</span>`);
  } else if (label === "flash") {
    if (!s.available) return `<span class="pill">${s.note||"Flashscore inactiv"}</span>`;
    items.push(`<span class="pill">Flash: ${s.homeForm||"n/a"} vs ${s.awayForm||"n/a"}</span>`);
    items.push(`<span class="pill pill-blue">Bonus: +${s.boost||0}</span>`);
    if (s.hasLineups) items.push(`<span class="pill pill-green">Lineup ✓</span>`);
  } else if (label === "footy") {
    if (!s.xgBoost && !s.totalXg) return `<span class="pill">${s.note||"FootyStats inactiv"}</span>`;
    if (s.totalXg) items.push(`<span class="pill">xG: ${s.homeXg?.toFixed(1)||"n/a"}+${s.awayXg?.toFixed(1)||"n/a"}=${s.totalXg?.toFixed(1)||"n/a"}</span>`);
    if (s.bttsRate) items.push(`<span class="pill">BTTS: ${Math.round(s.bttsRate)}%</span>`);
    items.push(`<span class="pill pill-blue">Bonus xG: +${s.xgBoost||0}</span>`);
  } else if (label === "elo") {
    if (!s.homeElo) return `<span class="pill">${s.note||"ELO inactiv"}</span>`;
    items.push(`<span class="pill">ELO: ${Math.round(s.homeElo||0)} vs ${Math.round(s.awayElo||0)}</span>`);
    items.push(`<span class="pill">Prob gazde: ${s.homeWinProb||"n/a"}%</span>`);
    items.push(`<span class="pill pill-blue">Bonus ELO: +${s.eloBoost||0}</span>`);
  }
  return items.join("");
}

function selectionCard(t, title) {
  if (!t) return "";
  const verdictCls = t.verdict === "JOACĂ" ? "verdict-good" : "verdict-med";
  const sourceBadge = t.dataSource ? `<span class="source-badge">${t.dataSource}</span>` : "";
  const liveInfo = t.live ? `<div class="report-box" style="margin-top:8px"><span class="pill live">LIVE ${t.live.minute}'</span><span class="pill">Scor ${t.live.score}</span><span class="pill">${t.live.status}</span></div>` : "";
  return `
  <div class="report-box">
    <div class="label">${title} ${sourceBadge}</div>
    <div class="value" style="font-size:17px">${t.match||"?"}</div>
    <div style="margin-bottom:8px">
      <span class="pill ${statusClass(t.timeStatus)}">${t.timeStatus||"PRE-MATCH"}</span>
      <span class="pill">Piață: ${t.marketLabel||"?"}</span>
      <span class="pill">${t.bookmaker||""}</span>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">Selecție</div><div class="stat-value">${t.pick||"?"}</div></div>
      <div class="stat-box"><div class="stat-label">Cotă</div><div class="stat-value">${t.odd||"n/a"}</div></div>
      <div class="stat-box"><div class="stat-label">Safe Score</div><div class="stat-value">${t.safeScore??0}/100</div></div>
      <div class="stat-box"><div class="stat-label">Start</div><div class="stat-value" style="font-size:12px">${t.startTime||"?"}</div></div>
    </div>
    ${liveInfo}
    <div style="margin-top:12px">
      <div class="label">Verdict</div>
      <div class="${verdictCls}">${t.verdict||"?"}</div>
      <div class="small" style="margin-top:6px">${t.reason||""}</div>
    </div>
    ${t.footballStats ? `<div class="report-box" style="margin-top:8px"><div class="label">API-Football</div>${pillsFromStats("football",t.footballStats)}<div class="small" style="margin-top:6px">${t.footballStats.note||""}</div></div>` : ""}
    ${t.flashscoreStats ? `<div class="report-box" style="margin-top:8px"><div class="label">Flashscore</div>${pillsFromStats("flash",t.flashscoreStats)}</div>` : ""}
    ${t.footyStats ? `<div class="report-box" style="margin-top:8px"><div class="label">FootyStats xG</div>${pillsFromStats("footy",t.footyStats)}<div class="small" style="margin-top:6px">${t.footyStats.note||""}</div></div>` : ""}
    ${t.eloStats ? `<div class="report-box" style="margin-top:8px"><div class="label">Club ELO</div>${pillsFromStats("elo",t.eloStats)}<div class="small" style="margin-top:6px">${t.eloStats.note||""}</div></div>` : ""}
  </div>`;
}

function topBox(list) {
  if (!list?.length) return "";
  return `<div class="report-box"><div class="label">Top ${list.length} selecții</div>
  ${list.map(x => `<div class="top-item">
    <b>${x.match}</b><br>
    <span style="color:#cbd5e1">${x.pick}</span><br>
    <span class="pill ${statusClass(x.timeStatus)}">${x.timeStatus}</span>
    <span class="pill">Piață: ${x.marketLabel}</span>
    <span class="pill">Cotă: ${x.odd}</span>
    <span class="pill ${x.safeScore>=75?"pill-green":"pill-yellow"}">Score: ${x.safeScore}/100</span>
    <span class="source-badge">${x.dataSource||x.bookmaker||""}</span>
  </div>`).join("")}
  </div>`;
}

function marketsBox(r) {
  const m = r.marketStats || {}, ts = r.timeStats || {};
  const sources = (r.sourceUsed||[]).map(s => `<span class="source-badge">${s}</span>`).join(" ");
  return `<div class="report-box">
    <div class="label">Surse date</div>
    <div style="margin-bottom:8px">${sources || "<span class='small'>nicio sursă</span>"}</div>
    <div class="label">Piețe scanate</div>
    <span class="pill">1X2: ${m.h2h||0}</span>
    <span class="pill">Goluri: ${m.totals||0}</span>
    <span class="pill">Handicap: ${m.spreads||0}</span>
    <span class="pill">BTTS: ${m.btts||0}</span>
    <span class="pill">Altele: ${m.other||0}</span>
    <div style="margin-top:8px">
      <span class="pill live">LIVE: ${ts.live||0}</span>
      <span class="pill soon">Curând: ${ts.soon||0}</span>
      <span class="pill prematch">Pre-match: ${ts.prematch||0}</span>
    </div>
    <div style="margin-top:8px" class="small">
      FootyStats: ${r.footystatsEnabled?"✅ activ":"⚠️ inactiv (opțional)"}
      · Flashscore: ${r.flashscoreEnabled?"✅ activ":"⚠️ opțional"}
      · Odds API: ${r.oddsApiWorking?"✅ OK":"⚠️ fallback activ"}
    </div>
  </div>`;
}

function renderResult(data) {
  const r = data.report || {};
  const t = data.tip || r.bestOverall || r.firstAvailable;
  currentTip = t || null;
  document.getElementById("recommendation").innerHTML = `
    <div class="report-box">
      <div class="label">Raport scanare</div>
      <span class="pill">Meciuri: ${r.eventsChecked||0}</span>
      <span class="pill">Opțiuni: ${r.outcomesChecked||0}</span>
      <span class="pill">Scanat: ${r.scannedAt||"-"}</span>
      <div class="small" style="margin-top:8px">${data.message||""}</div>
    </div>
    ${marketsBox(r)}
    ${t ? selectionCard(t, data.accepted ? "✅ Recomandare acceptată" : "🔎 Cea mai bună selecție") : ""}
    ${topBox(r.topOverall)}`;
}

// ─── Scan ─────────────────────────────────────────────────────────────────────
async function scanRealMatches() {
  const st = document.getElementById("status");
  st.innerHTML = `<span class="warning-msg">⏳ Scanez toate sursele în paralel...</span>`;
  document.getElementById("recommendation").innerHTML = "";
  try {
    const res = await fetch("/api/scan?ts=" + Date.now());
    const data = await res.json();
    if (!res.ok) {
      st.innerHTML = `<span class="error-msg">❌ ${data.error||"Eroare API"} — ${data.help||""}</span>`;
      return;
    }
    st.innerHTML = data.accepted
      ? `<span class="success-msg">✅ Selecție găsită peste prag!</span>`
      : `<span class="warning-msg">⚠️ Sub prag — afișez cea mai bună opțiune.</span>`;
    renderResult(data);
  } catch (e) {
    st.innerHTML = `<span class="error-msg">❌ Nu pot conecta la API. (${e.message})</span>`;
  }
}

// ─── Live Auto ────────────────────────────────────────────────────────────────
const LIVE_INTERVAL_SEC = 20;

function toggleLive() {
  if (liveActive) {
    clearInterval(liveInterval);
    clearInterval(window._cdTimer);
    liveActive = false;
    document.getElementById("btn-live").textContent = "📡 Live Auto";
    document.getElementById("btn-live").className = "btn-blue";
    document.getElementById("live-indicator").classList.remove("active");
    document.getElementById("countdown").textContent = "";
  } else {
    liveActive = true;
    document.getElementById("btn-live").textContent = "⏹ Stop Live";
    document.getElementById("btn-live").className = "btn-loss";
    document.getElementById("live-indicator").classList.add("active");
    scanRealMatches();
    refreshCountdown = LIVE_INTERVAL_SEC;
    liveInterval = setInterval(() => { scanRealMatches(); refreshCountdown = LIVE_INTERVAL_SEC; }, LIVE_INTERVAL_SEC * 1000);
    window._cdTimer = setInterval(() => {
      refreshCountdown--;
      document.getElementById("countdown").textContent = refreshCountdown > 0 ? `⏱ Refresh în ${refreshCountdown}s` : "";
      document.getElementById("next-refresh").textContent = refreshCountdown > 0 ? `(${refreshCountdown}s)` : "";
    }, 1000);
  }
}

// ─── Istoric ──────────────────────────────────────────────────────────────────
async function renderHistory() {
  const history = await dbGetAll().catch(() => []);
  const el = document.getElementById("history");
  const sb = document.getElementById("stats-bar");
  if (!history.length) { el.innerHTML = "Nu ai istoric încă."; sb.innerHTML = ""; return; }
  const wins = history.filter(h => h.result === "Câștigat").length;
  const losses = history.filter(h => h.result === "Pierdut").length;
  const rate = history.length ? Math.round((wins / history.length) * 100) : 0;
  sb.innerHTML = `<span class="pill pill-green">✅ ${wins} câștigate</span><span class="pill pill-red">❌ ${losses} pierdute</span><span class="pill">${rate}% rată succes</span>`;
  el.innerHTML = history.slice().reverse().map(h =>
    `<div class="top-item">
      <b class="${h.result==="Câștigat"?"success-msg":"error-msg"}">${h.result}</b> · ${h.match||""}
      <br>${h.pick||""} · ${h.marketLabel||""} · Cotă ${h.odd||"n/a"}
      <br><span class="small">${h.time ? new Date(h.time).toLocaleString("ro-RO") : ""}</span>
    </div>`
  ).join("");
}

async function addHistory(result) {
  if (!currentTip) return;
  await dbAdd({ result, match: currentTip.match, pick: currentTip.pick, marketLabel: currentTip.marketLabel, odd: currentTip.odd, time: new Date().toISOString() }).catch(()=>{});
  renderHistory();
}

async function clearHistory() {
  if (!confirm("Ștergi tot istoricul?")) return;
  await dbClear().catch(()=>{});
  renderHistory();
}

async function exportHistory() {
  const history = await dbGetAll().catch(() => []);
  const blob = new Blob([JSON.stringify(history, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "safebet-history.json"; a.click();
}

function markWin() { addHistory("Câștigat"); }
function markLoss() { addHistory("Pierdut"); }
function skipTip() { currentTip = null; document.getElementById("recommendation").innerHTML = ""; document.getElementById("status").textContent = "Recomandarea a fost sărită."; }

// ─── Init ─────────────────────────────────────────────────────────────────────
renderHistory();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
