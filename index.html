<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <title>SafeBet Bot</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background:#0f172a; color:white; margin:0; padding:22px; }
    h1 { font-size: 34px; margin: 38px 0 28px; }
    .card{ background:#1e293b; padding:22px; border-radius:22px; margin-bottom:20px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
    .label { color:#94a3b8; font-size:14px; margin-bottom:6px; }
    .value { font-size:20px; margin-bottom:14px; }
    input { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 18px; margin-top: 8px; }
    button{ background:#22c55e; border:none; padding:14px 18px; border-radius:13px; color:white; font-size:17px; font-weight:700; cursor:pointer; margin: 6px 6px 6px 0; }
    button.secondary { background:#334155; }
    button.danger { background:#ef4444; }
    .small { color:#94a3b8; font-size:13px; line-height:1.45; }
    .tip-title { font-size: 23px; font-weight: 800; margin-bottom: 15px; }
    .pill { display:inline-block; padding:7px 10px; border-radius:999px; background:#0f172a; color:#cbd5e1; margin:4px 4px 8px 0; font-size:13px; }
    .error { color:#fecaca; }
    .success { color:#bbf7d0; }
    .history-item { border-top:1px solid #334155; padding:10px 0; font-size:14px; color:#cbd5e1; }
  </style>
</head>
<body>
  <h1>⚽ SafeBet Bot</h1>

  <div class="card">
    <div class="tip-title">Buget curent</div>
    <div class="value"><span id="bankroll">2.00</span> lei</div>
    <div class="small">Schimbă bugetul dacă vrei. Se salvează pe telefon/browser.</div>
    <input id="bankrollInput" type="number" min="0" step="0.01" placeholder="Ex: 2" />
    <button onclick="saveBankroll()">Salvează buget</button>
  </div>

  <div class="card">
    <div class="tip-title">Recomandare reală</div>
    <div id="status" class="small">Apasă „Scanează meciuri reale”.</div>
    <div id="recommendation" style="margin-top:14px;"></div>
    <button onclick="scanRealMatches()">Scanează meciuri reale</button>
    <button class="secondary" onclick="skipTip()">Sari peste</button>
    <button onclick="markWin()">Câștigat</button>
    <button class="danger" onclick="markLoss()">Pierdut</button>
  </div>

  <div class="card">
    <div class="tip-title">Istoric</div>
    <div id="history" class="small">Nu ai istoric încă.</div>
  </div>

<script>
let bankroll = Number(localStorage.getItem("bankroll") || "2");
let currentTip = null;
let history = JSON.parse(localStorage.getItem("history") || "[]");

function fmt(n){ return Number(n).toFixed(2); }

function renderBankroll(){
  document.getElementById("bankroll").innerText = fmt(bankroll);
  document.getElementById("bankrollInput").value = bankroll;
}

function saveBankroll(){
  const val = Number(document.getElementById("bankrollInput").value);
  if(!isNaN(val) && val >= 0){
    bankroll = val;
    localStorage.setItem("bankroll", bankroll);
    renderBankroll();
  }
}

function renderHistory(){
  const el = document.getElementById("history");
  if(history.length === 0){
    el.innerText = "Nu ai istoric încă.";
    return;
  }
  el.innerHTML = history.slice().reverse().map(h => `
    <div class="history-item">
      <b>${h.result}</b> · ${h.match}<br/>
      ${h.pick} · Cotă ${h.odd} · Buget: ${h.bankroll} lei
    </div>
  `).join("");
}

function renderTip(tip){
  currentTip = tip;
  document.getElementById("recommendation").innerHTML = `
    <div class="label">Meci</div>
    <div class="value">${tip.match}</div>
    <div class="label">Pariu recomandat</div>
    <div class="value">${tip.pick}</div>
    <span class="pill">Cotă: ${tip.odd}</span>
    <span class="pill">Safe Score: ${tip.safeScore}/100</span>
    <span class="pill">Miză sugerată: ${fmt(bankroll)} lei</span>
    <span class="pill">Start: ${tip.startTime || "necunoscut"}</span>
    <div class="small" style="margin-top:10px;">Motiv: ${tip.reason}</div>
  `;
}

async function scanRealMatches(){
  const status = document.getElementById("status");
  status.innerHTML = "Scanez cote reale...";
  document.getElementById("recommendation").innerHTML = "";
  try {
    const res = await fetch("/api/scan");
    const data = await res.json();
    if(!res.ok){
      status.innerHTML = `<span class="error">${data.error || "Eroare API"}</span>`;
      if(data.help){ document.getElementById("recommendation").innerHTML = `<div class="small">${data.help}</div>`; }
      return;
    }
    if(!data.tip){
      status.innerHTML = `<span class="error">Nu am găsit momentan un meci suficient de safe.</span>`;
      return;
    }
    status.innerHTML = `<span class="success">Am găsit o recomandare.</span>`;
    renderTip(data.tip);
  } catch(e){
    status.innerHTML = `<span class="error">Nu pot conecta aplicația la API acum.</span>`;
  }
}

function addHistory(result){
  if(!currentTip) return;
  history.push({ result, match: currentTip.match, pick: currentTip.pick, odd: currentTip.odd, bankroll: fmt(bankroll), time: new Date().toISOString() });
  localStorage.setItem("history", JSON.stringify(history));
  renderHistory();
}

function markWin(){
  if(!currentTip) return;
  bankroll = bankroll * Number(currentTip.odd);
  localStorage.setItem("bankroll", bankroll);
  addHistory("Câștigat");
  renderBankroll();
}

function markLoss(){
  if(!currentTip) return;
  bankroll = 0;
  localStorage.setItem("bankroll", bankroll);
  addHistory("Pierdut");
  renderBankroll();
}

function skipTip(){
  currentTip = null;
  document.getElementById("recommendation").innerHTML = "";
  document.getElementById("status").innerText = "Recomandarea a fost sărită.";
}

renderBankroll();
renderHistory();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js").catch(() => {}); }
</script>
</body>
</html>
