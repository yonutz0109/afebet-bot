<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeBet Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      margin:0;
      padding:20px;
    }
    .card{
      background:#1e293b;
      padding:20px;
      border-radius:16px;
      margin-bottom:20px;
    }
    button{
      background:#22c55e;
      border:none;
      padding:12px 18px;
      border-radius:10px;
      color:white;
      font-size:16px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <h1>⚽ SafeBet Bot</h1>

  <div class="card">
    <h2>Buget curent</h2>
    <p id="bankroll">2.00 lei</p>
  </div>

  <div class="card">
    <h2>Recomandare</h2>
    <p id="tip">Apasă pe buton pentru analiză.</p>
    <button onclick="generateTip()">Scanează meciuri</button>
  </div>

  <script>
    const tips = [
      "Peste 0.5 goluri - Cotă 1.18 - Safe Score 84",
      "1X echipa gazdă - Cotă 1.32 - Safe Score 81",
      "Peste 1.5 goluri - Cotă 1.40 - Safe Score 78",
      "Sub 5.5 cartonașe - Cotă 1.25 - Safe Score 76"
    ];

    function generateTip(){
      const random = tips[Math.floor(Math.random()*tips.length)];
      document.getElementById("tip").innerText = random;
    }
  </script>
</body>
</html>
